<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デュエマ デッキ管理</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    main {
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      margin-top: 10px;
    }

    button:active {
      opacity: 0.7;
    }

    .deck-item {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
    }

    .empty {
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎴 デュエマ デッキ管理</h1>
  </header>

  <main>

    <div class="card">
      <h2>デッキ作成</h2>
      <p>デッキ名を入力してください。</p>

      <input
        id="deckName"
        type="text"
        placeholder="例：火自然ボルシャック"
      >

      <button onclick="createDeck()">デッキを作成する</button>
    </div>

    <div class="card">
      <h2>📚 マイデッキ</h2>
      <div id="deckList"></div>
    </div>

    <div class="card">
      <h2>🤖 AI対戦</h2>
      <p>今後、AIとの対戦機能を追加予定です。</p>
      <button disabled>AI対戦（準備中）</button>
    </div>

    <div class="card">
      <h2>📊 対戦記録</h2>
      <p>今後、対戦結果や勝率を記録できるようにします。</p>
      <button disabled>対戦記録（準備中）</button>
    </div>

  </main>

  <script>
    let decks = JSON.parse(localStorage.getItem("duelMastersDecks")) || [];

    function createDeck() {
      const input = document.getElementById("deckName");
      const name = input.value.trim();

      if (name === "") {
        alert("デッキ名を入力してください。");
        return;
      }

      decks.push({
        name: name,
        cards: []
      });

      localStorage.setItem("duelMastersDecks", JSON.stringify(decks));

      input.value = "";
      renderDecks();
    }

    function renderDecks() {
      const deckList = document.getElementById("deckList");
      deckList.innerHTML = "";

      if (decks.length === 0) {
        deckList.innerHTML =
          '<p class="empty">まだデッキがありません。</p>';
        return;
      }

      decks.forEach(function(deck) {
        const div = document.createElement("div");
        div.className = "deck-item";
        div.textContent = "🎴 " + deck.name;
        deckList.appendChild(div);
      });
    }

    renderDecks();
  </script>

</body>
</html>
