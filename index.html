<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デュエマ デッキ管理</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      padding: 18px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    main {
      padding: 16px;
      max-width: 900px;
      margin: auto;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input, textarea, select {
      width: 100%;
      box-sizing: border-box;
      margin-top: 8px;
      margin-bottom: 10px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      margin-top: 8px;
    }

    button.secondary {
      background: #666;
    }

    button.small {
      width: auto;
      padding: 8px 12px;
      margin: 0 4px;
    }

    .hidden {
      display: none;
    }

    .deck-item {
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-top: 10px;
      background: #fafafa;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .card-box {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .card-image {
      width: 100%;
      aspect-ratio: 5 / 7;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 13px;
      overflow: hidden;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      padding: 10px;
    }

    .card-name {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .meta {
      font-size: 12px;
      color: #555;
      line-height: 1.5;
    }

    .effect {
      font-size: 12px;
      margin-top: 8px;
      white-space: pre-wrap;
    }

    .qty {
      font-size: 18px;
      font-weight: bold;
      margin: 8px 0;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .count-big {
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎴 デュエマ デッキ管理</h1>
  </header>

  <main>

    <div id="homeScreen">

      <div class="panel">
        <h2>デッキ作成</h2>

        <input
          id="deckName"
          type="text"
          placeholder="デッキ名を入力"
        >

        <button onclick="createDeck()">デッキを作成する</button>
      </div>

      <div class="panel">
        <h2>📚 マイデッキ</h2>
        <div id="deckList"></div>
      </div>

    </div>

    <div id="deckScreen" class="hidden">

      <div class="panel">
        <button class="secondary" onclick="goHome()">← 戻る</button>

        <h2 id="currentDeckName"></h2>

        <div>
          合計：
          <span id="deckCount" class="count-big">0</span>
          / 40枚
        </div>
      </div>

      <div class="panel">
        <h2>🃏 カード登録</h2>

        <input id="cardName" placeholder="カード名">

        <input id="cardImage" placeholder="画像ファイル名 例: card001.jpg">

        <select id="civilization">
          <option value="">文明を選択</option>
          <option>光</option>
          <option>水</option>
          <option>闇</option>
          <option>火</option>
          <option>自然</option>
          <option>無色</option>
          <option>多色</option>
        </select>

        <input id="cost" type="number" placeholder="コスト">

        <input id="cardType" placeholder="種類 例: クリーチャー">

        <input id="power" placeholder="パワー 例: 5000">

        <textarea id="effectText" placeholder="能力テキスト"></textarea>

        <button onclick="addNewCard()">カードを登録する</button>
      </div>

      <div class="panel">
        <h2>デッキ内容</h2>
        <div id="cardGrid" class="card-grid"></div>
      </div>

    </div>

  </main>

  <script>
    let decks = JSON.parse(localStorage.getItem("duelMastersDecksV2")) || [];
    let currentDeckIndex = null;

    function save() {
      localStorage.setItem("duelMastersDecksV2", JSON.stringify(decks));
    }

    function createDeck() {
      const input = document.getElementById("deckName");
      const name = input.value.trim();

      if (!name) {
        alert("デッキ名を入力してください。");
        return;
      }

      decks.push({
        name: name,
        cards: []
      });

      input.value = "";
      save();
      renderDecks();
    }

    function renderDecks() {
      const deckList = document.getElementById("deckList");
      deckList.innerHTML = "";

      if (decks.length === 0) {
        deckList.innerHTML = "<p>まだデッキがありません。</p>";
        return;
      }

      decks.forEach((deck, index) => {
        const div = document.createElement("div");
        div.className = "deck-item";

        const total = deck.cards.reduce((sum, card) => sum + card.qty, 0);

        div.innerHTML =
          "<strong>🎴 " + escapeHtml(deck.name) + "</strong><br>" +
          total + "/40枚";

        div.onclick = () => openDeck(index);
        deckList.appendChild(div);
      });
    }

    function openDeck(index) {
      currentDeckIndex = index;

      document.getElementById("homeScreen").classList.add("hidden");
      document.getElementById("deckScreen").classList.remove("hidden");

      renderCurrentDeck();
    }

    function goHome() {
      currentDeckIndex = null;

      document.getElementById("deckScreen").classList.add("hidden");
      document.getElementById("homeScreen").classList.remove("hidden");

      renderDecks();
    }

    function addNewCard() {
      if (currentDeckIndex === null) return;

      const deck = decks[currentDeckIndex];

      const name = document.getElementById("cardName").value.trim();
      const image = document.getElementById("cardImage").value.trim();
      const civilization = document.getElementById("civilization").value;
      const cost = document.getElementById("cost").value;
      const type = document.getElementById("cardType").value.trim();
      const power = document.getElementById("power").value.trim();
      const effect = document.getElementById("effectText").value.trim();

      if (!name) {
        alert("カード名を入力してください。");
        return;
      }

      const total = deck.cards.reduce((sum, card) => sum + card.qty, 0);

      if (total >= 40) {
        alert("デッキは40枚までです。");
        return;
      }

      const sameCard = deck.cards.find(card => card.name === name);

      if (sameCard) {
        if (sameCard.qty >= 4) {
          alert("同名カードは4枚までにしています。");
          return;
        }

        sameCard.qty += 1;
      } else {
        deck.cards.push({
          name,
          image,
          civilization,
          cost,
          type,
          power,
          effect,
          qty: 1
        });
      }

      save();
      clearCardForm();
      renderCurrentDeck();
    }

    function clearCardForm() {
      document.getElementById("cardName").value = "";
      document.getElementById("cardImage").value = "";
      document.getElementById("civilization").value = "";
      document.getElementById("cost").value = "";
      document.getElementById("cardType").value = "";
      document.getElementById("power").value = "";
      document.getElementById("effectText").value = "";
    }

    function changeQty(cardIndex, amount) {
      const deck = decks[currentDeckIndex];
      const card = deck.cards[cardIndex];

      const total = deck.cards.reduce((sum, c) => sum + c.qty, 0);

      if (amount > 0) {
        if (card.qty >= 4) {
          alert("同名カードは4枚までにしています。");
          return;
        }

        if (total >= 40) {
          alert("デッキは40枚までです。");
          return;
        }
      }

      card.qty += amount;

      if (card.qty <= 0) {
        deck.cards.splice(cardIndex, 1);
      }

      save();
      renderCurrentDeck();
    }

    function deleteCard(cardIndex) {
      if (!confirm("このカードをデッキから削除しますか？")) {
        return;
      }

      decks[currentDeckIndex].cards.splice(cardIndex, 1);
      save();
      renderCurrentDeck();
    }

    function renderCurrentDeck() {
      const deck = decks[currentDeckIndex];

      document.getElementById("currentDeckName").textContent =
        "🎴 " + deck.name;

      const total = deck.cards.reduce((sum, card) => sum + card.qty, 0);

      document.getElementById("deckCount").textContent = total;

      const grid = document.getElementById("cardGrid");
      grid.innerHTML = "";

      if (deck.cards.length === 0) {
        grid.innerHTML = "<p>まだカードがありません。</p>";
        return;
      }

      deck.cards.forEach((card, index) => {
        const box = document.createElement("div");
        box.className = "card-box";

        const imageHtml = card.image
          ? '<img src="' + escapeHtml(card.image) + '" alt="' + escapeHtml(card.name) + '">'
          : "画像なし";

        box.innerHTML = `
          <div class="card-image">
            ${imageHtml}
          </div>

          <div class="card-info">
            <div class="card-name">${escapeHtml(card.name)}</div>

            <div class="meta">
              文明：${escapeHtml(card.civilization || "-")}<br>
              コスト：${escapeHtml(card.cost || "-")}<br>
              種類：${escapeHtml(card.type || "-")}<br>
              パワー：${escapeHtml(card.power || "-")}
            </div>

            <div class="effect">${escapeHtml(card.effect || "")}</div>

            <div class="qty">×${card.qty}</div>

            <div class="controls">
              <button class="small" onclick="changeQty(${index}, -1)">−</button>
              <button class="small" onclick="changeQty(${index}, 1)">＋</button>
              <button class="small secondary" onclick="deleteCard(${index})">削除</button>
            </div>
          </div>
        `;

        grid.appendChild(box);
      });
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    renderDecks();
  </script>

</body>
</html>
