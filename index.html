<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デュエマ デッキ管理</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    main {
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      margin-top: 10px;
    }

    button:active {
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎴 デュエマ デッキ管理</h1>
  </header>

  <main>

    <div class="card">
      <h2>デッキ管理</h2>
      <p>あなたのデュエマデッキを管理できます。</p>
      <button>デッキを作成する</button>
    </div>

    <div class="card">
      <h2>🤖 AI対戦</h2>
      <p>今後、AIとの対戦機能を追加予定です。</p>
      <button>AI対戦（準備中）</button>
    </div>

    <div class="card">
      <h2>📊 対戦記録</h2>
      <p>今後、対戦結果や勝率を記録できるようにします。</p>
      <button>対戦記録（準備中）</button>
    </div>

  </main>

</body>
</html>
