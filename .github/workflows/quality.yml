name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run codex:check
      - run: npm run check
      - run: npm test
      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD
