name: Repair index once

on:
  push:
    paths:
      - ".github/workflows/repair-index.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair index.html
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          # 旧版の重複 searchCardCatalog を退避名へ変更する。
          marker = '"cardLookupName"'
          marker_pos = text.find(marker)
          if marker_pos >= 0:
              start = text.rfind("function searchCardCatalog(){", 0, marker_pos)
              if start >= 0:
                  old = "function searchCardCatalog(){"
                  new = "function searchCardCatalogLegacy(){"
                  text = text[:start] + text[start:].replace(old, new, 1)

          # index.html がインライン script の途中で終わっている場合にだけ閉じる。
          if not text.rstrip().endswith("</html>"):
              text = text.rstrip() + "\n\n</script>\n<script type=\"module\" src=\"firebase-auth.js\"></script>\n</body>\n</html>\n"

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit repair
        run: |
          if git diff --quiet -- index.html; then
            echo "No repair needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: repair index script loading and duplicate catalog search"
          git push
