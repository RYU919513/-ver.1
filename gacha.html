<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUELIX CFL Special Gacha</title><style>body{font-family:system-ui;margin:0;background:#f4f5f7;color:#171717}main{max-width:760px;margin:auto;padding:18px}.p{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:14px}button,input{font:inherit;padding:11px;border-radius:10px}button{background:#171717;color:white;border:0}.muted{color:#64748b;font-size:13px}.result{font-size:22px;font-weight:800}</style></head><body><main><div class="p"><h1>✨ Special Print Gacha</h1><p>シークレット・金トレジャー・プロモなどの「版」を抽選するための基盤です。通常カードのルール情報とは分離します。</p><p class="muted">現時点では実カードの特殊版カタログを勝手に作っていません。JSONカタログを読み込むと抽選できます。課金・換金機能は含みません。</p><input id="file" type="file" accept="application/json,.json"><button id="draw">1回引く</button><p id="status" class="muted">カタログ未読込</p></div><div class="p"><div id="result" class="result">—</div><div id="meta" class="muted"></div></div><p><a href="card-vault.html">← Card Vaultへ戻る</a></p></main><script src="gacha-engine.js"></script><script>let catalog=null;file.onchange=async e=>{try{catalog=JSON.parse(await e.target.files[0].text());const v=DuelixGacha.validateCatalog(catalog);if(!v.ok)throw new Error(v.reason);status.textContent=`抽選対象 ${v.eligible.length}件`; }catch(err){catalog=null;status.textContent=err.message;}};draw.onclick=()=>{try{const x=DuelixGacha.draw(catalog);result.textContent=x.name;meta.textContent=`${x.variantType} / ${x.printingId||x.id}`;}catch(err){result.textContent='—';meta.textContent=err.message;}};</script></body></html>
